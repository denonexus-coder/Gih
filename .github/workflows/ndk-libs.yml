name: Extrair libc++ estática
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar NDK r27d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724"
      - name: Copiar libs
        run: |
          NDK="$ANDROID_HOME/ndk/27.3.13750724"
          mkdir -p out
          for f in libc++_static.a libc++abi.a libunwind.a; do
            P=$(find "$NDK" -name "$f" -path '*aarch64*' | head -1)
            echo "$f -> ${P:-NAO ENCONTRADO}"
            [ -n "$P" ] && cp "$P" out/
          done
          ls -lh out
          test -f out/libc++_static.a
      - uses: actions/upload-artifact@v4
        with:
          name: libcxx-arm64
          path: out/*.a
          if-no-files-found: error
