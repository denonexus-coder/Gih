name: Extrair libc++ estática
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar NDK r27d
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724"
      - name: Copiar libs
        run: |
          NDK="$ANDROID_HOME/ndk/27.3.13750724"
          L="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          mkdir -p out
          cp "$L/libc++_static.a" "$L/libc++abi.a" "$L/libunwind.a" out/
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: libcxx-arm64
          path: out/*.a
          if-no-files-found: error
